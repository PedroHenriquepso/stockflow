<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow — Orçamentos</title>
  <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>
  <div class="app">
    <!-- MENU LATERAL -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>StockFlow</h2>
        <p>Vendas e Estoque</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/produtos">📦 Produtos</a>
        <a href="/clientes">👥 Clientes</a>
        <a href="/orcamentos" class="ativo">📝 Orçamentos</a>
        <a href="/vendas">💰 Vendas</a>
      </nav>
      <div class="sidebar-rodape">
        <button id="botao-sair">Sair</button>
      </div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="conteudo">
      <div class="topbar">
        <h1>Painel de Orçamentos</h1>
        <div class="usuario">Logado como <strong id="nome-usuario">—</strong></div>
      </div>

      <div class="pagina">
        <!-- BARRA DE FERRAMENTAS -->
        <div class="card" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
          
          <!-- Botões de Status -->
          <div style="display: flex; gap: 10px;">
            <button class="botao btn-status" data-status="aberto" style="width: auto; padding: 8px 15px; background: #2563eb; color: white;">Em Aberto</button>
            <button class="botao btn-status" data-status="concluido" style="width: auto; padding: 8px 15px; background: #94a3b8; color: white;">Concluídos</button>
            <button class="botao btn-status" data-status="cancelado" style="width: auto; padding: 8px 15px; background: #94a3b8; color: white;">Cancelados</button>
          </div>

          <!-- Botões de Ação -->
          <div style="display: flex; gap: 10px;">
            <button class="botao" id="btn-f3" style="width: auto; padding: 10px 20px; background: #f59e0b;">F3 - Buscar</button>
            <button class="botao" id="btn-f9" style="width: auto; padding: 10px 20px; background: #16a34a;">F9 - Novo Orçamento</button>
          </div>
        </div>

        <!-- CAMPO DE BUSCA (F3) -->
        <div class="card" id="area-busca" style="display: none; margin-bottom: 20px; padding: 15px;">
          <input type="text" id="campo-busca" placeholder="Busque por nome do cliente, veículo, código ou produto..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;">
        </div>

        <!-- TABELA DE ORÇAMENTOS -->
        <div class="card">
          <table style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
              <tr style="border-bottom: 2px solid #e2e8f0; font-size: 14px;">
                <th style="padding: 12px;">Nº</th>
                <th style="padding: 12px;">Data</th>
                <th style="padding: 12px;">Cliente</th>
                <th style="padding: 12px;">Veículo</th>
                <th style="padding: 12px;">Total</th>
                <th style="padding: 12px;">Status</th>
                <th style="padding: 12px;">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-orcamentos">
              <!-- JS vai preencher aqui -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  
  <script src="/static/js/global.js?v=3"></script>
  <script src="/static/js/lista_orcamentos.js?v=1"></script>
</body>
</html>
