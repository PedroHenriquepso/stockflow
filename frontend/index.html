<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlow — Login</title>
  <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>StockFlow</h1>
        <p>Sistema de Vendas e Estoque</p>
      </div>

      <div id="mensagem-erro" class="mensagem-erro"></div>

      <form id="form-login">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required autofocus>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required>
        </div>

        <button type="submit" class="botao" id="botao-entrar">Entrar</button>
      </form>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
